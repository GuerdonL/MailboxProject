name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Google Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::error::MAPS_API_KEY repository secret is not set"; exit 1
          fi
          sed -i "s|__MAPS_API_KEY__|$MAPS_API_KEY|g" public/index.html
          grep -q "__MAPS_API_KEY__" public/index.html && { echo "::error::placeholder still present"; exit 1; } || true
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAILBOX_60855 }}'
          channelId: live
          projectId: mailbox-60855
