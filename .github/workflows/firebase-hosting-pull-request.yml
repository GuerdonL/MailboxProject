name: Deploy to Firebase Hosting on PR
'on': pull_request
jobs:
  build_and_preview:
    # Secrets are not available to PRs from forks, so only preview same-repo branches.
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Google Maps API key
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::error::MAPS_API_KEY repository secret is not set"; exit 1
          fi
          sed -i "s|__MAPS_API_KEY__|$MAPS_API_KEY|g" public/index.html
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MAILBOX_60855 }}'
          projectId: mailbox-60855
